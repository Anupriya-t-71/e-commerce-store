apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      imagePullSecrets:
        - name: harbor-secret
      containers:
      - name: user-service
        image: 13.232.36.18:443/backend/user-service:1.0
        ports:
        - containerPort: 3001
        envFrom:
          - configMapRef:
              name: user-config
          - secretRef:
              name: user-secret  
---            
